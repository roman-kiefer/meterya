name: meterya

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Set KC_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-meterya.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/meterya-keycloak:${API_TAG:?Set API_TAG in .env}
    command: [start, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: operator
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?}
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HOSTNAME: https://${PUBLIC_HOST:?}/identity
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET in .env}
      KEYCLOAK_SERVICE_SECRET: ${KEYCLOAK_SERVICE_SECRET:?Set KEYCLOAK_SERVICE_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in .env}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
    volumes:
      - ./realm/realm.template.json:/opt/keycloak/data/import/meterya-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/${GHCR_OWNER:?}/meterya-api:${API_TAG:?}
    environment:
      DATABASE_URL: postgres://meterya:${APP_DB_PASSWORD:?}@postgres/meterya?sslmode=disable
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?}
      OIDC_ISSUER: https://${PUBLIC_HOST:?}/identity/realms/meterya
      OIDC_INTERNAL_BASE: http://keycloak:8080/identity
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      KEYCLOAK_SERVICE_SECRET: ${KEYCLOAK_SERVICE_SECRET:?}
      OPERATOR_SUBJECT: ${OPERATOR_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER:?}/meterya-app:${APP_TAG:?}
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - keycloak
      - web
    restart: unless-stopped

volumes:
  postgres-data:
